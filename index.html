<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Türkiye açık su masters yarış sonuçları, yaş grubu sıralamaları ve kulüp madalya tablosu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230b5a7a%27/%3E%3Cpath d=%27M5 19q5.5-4 11 0t11 0M5 24q5.5-4 11 0t11 0%27 stroke=%27white%27 stroke-width=%272.4%27 fill=%27none%27/%3E%3C/svg%3E">
<title>Açık Su Masters Veritabanı</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar (home, search, rankings, races, clubs, mode, language) · ranking filters · one main area that shows
   the ranking table, a swimmer, a comparison or a race. Desktop first; stacks on phones. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --ink: #0f2533; --ink-2: #4a5d6a; --ink-3: #6f808c;
  --line: #d9e1e7; --sea: #0e5a7a; --sea-ink: #ffffff; --buoy: #e8641e; --sel: #e3eef4; --grid: #e6ecf0;
  --gold: #b88a00; --silver: #7f8c95; --bronze: #a0592f;
  --d1000: #2a78d6; --d2000: #eb6834; --d3000: #1baf7a; --d5000: #eda100;
  --d6000: #e87ba4; --d10000: #008300; --d6500: #6250d6; --d4500: #e34948;
  --pA: #2a78d6; --pB: #eb6834;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1820; --surface: #11222d; --ink: #e6eef3; --ink-2: #a9bac5; --ink-3: #8a9daa;
  --line: #22394a; --sea: #5fb3d9; --sea-ink: #0b1820; --buoy: #f07a3a; --sel: #173445; --grid: #1a2e3b;
  --gold: #e0b42a; --silver: #b3bfc7; --bronze: #c9825a;
  --d1000: #3987e5; --d2000: #d95926; --d3000: #199e70; --d5000: #c98500;
  --d6000: #d55181; --d10000: #2f9a2f; --d6500: #9085e9; --d4500: #e66767;
  --pA: #3987e5; --pB: #d95926; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1820; --surface: #11222d; --ink: #e6eef3; --ink-2: #a9bac5; --ink-3: #8a9daa;
  --line: #22394a; --sea: #5fb3d9; --sea-ink: #0b1820; --buoy: #f07a3a; --sel: #173445; --grid: #1a2e3b;
  --gold: #e0b42a; --silver: #b3bfc7; --bronze: #c9825a;
  --d1000: #3987e5; --d2000: #d95926; --d3000: #199e70; --d5000: #c98500;
  --d6000: #d55181; --d10000: #2f9a2f; --d6500: #9085e9; --d4500: #e66767;
  --pA: #3987e5; --pB: #d95926; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--buoy); outline-offset: 2px }
a { color: var(--sea) }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 3px solid var(--buoy);
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 0 }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0;
  text-align: left; margin-right: auto; min-width: 0 }
.brand svg { flex: none }
.brand b { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.02; text-transform: uppercase;
  letter-spacing: .01em; display: block; max-width: 250px }
.brand span { display: none }
nav.links { display: flex; gap: 2px; flex-wrap: wrap }
nav.links button, .lang button { border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-weight: 600; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; min-height: 40px }
nav.links button[aria-current=page] { color: var(--ink); background: var(--sel) }
nav.links button:hover, .lang button:hover { color: var(--ink) }
.search { position: relative; flex: 1 1 220px; min-width: 180px; max-width: 320px }
.search input { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px 9px 34px; min-height: 40px }
.search > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); list-style: none; margin: 0; padding: 4px; max-height: 360px; overflow: auto; z-index: 30 }
.sugg li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px }
.sugg li[aria-selected=true], .sugg li:hover { background: var(--sel) }
.sugg small { color: var(--ink-3); white-space: nowrap }
.lang { display: inline-flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.lang button { border-radius: 0; min-height: 34px; padding: 4px 9px; font-size: 13px }
.lang button[aria-pressed=true] { background: var(--sea); color: var(--sea-ink) }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; padding: 14px 0 10px }
.fld { display: flex; flex-direction: column; gap: 4px }
.fld > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3) }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface) }
.seg button { font-weight: 600; font-size: 14px; border: 0; background: transparent; color: var(--ink-2); padding: 7px 11px;
  cursor: pointer; min-height: 38px; font-variant-numeric: tabular-nums }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed=true] { background: var(--sea); color: var(--sea-ink) }
.seg button:disabled { opacity: .4; cursor: default }
.agseg { flex-wrap: wrap } .agseg button { min-width: 58px }
.rankgrid { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 18px; align-items: start }
.agside { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 92px); overflow-y: auto }
.aglab { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3) }
.seg.vert { display: flex; flex-direction: column; border-radius: 8px }
.seg.vert button { width: 100%; text-align: left; padding: 7px 12px; min-height: 34px; border-radius: 0 }
.seg.vert button + button { border-left: 0; border-top: 1px solid var(--line) }
@media (min-width: 761px) { #agFld { display: none } }
@media (max-width: 760px) { .rankgrid { display: block } .agside { display: none } .fsheet .agseg { display: grid; grid-template-columns: repeat(4, 1fr) } .fsheet .agseg button { border: 0; box-shadow: inset 0 0 0 .5px var(--line) } }

#filterBar.locked .filters, #filterBar.locked .fsum, .seg.mode.locked { opacity: .45; pointer-events: none }
#filterBar.locked select { cursor: default }
.lockmsg { display: none; font-size: 12px; color: var(--ink-3); margin: 2px 0 6px }
#filterBar.locked .lockmsg { display: block }
.bar .mode button { white-space: nowrap; font-size: 14px; padding: 6px 11px; min-height: 36px }
.fsum, .sheethead, .sheetbg, .brand .ts { display: none }
footer summary { cursor: pointer; font-weight: 600; color: var(--sea); padding: 6px 0 }
footer details > div { margin-top: 6px }
.heat th:nth-child(2), .heat td:nth-child(2) { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 130px }
.matrix th:first-child, .matrix td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1 }
td .sm, .rank .cr { display: none }
@media (min-width: 761px) { .bar { flex-wrap: nowrap } .search { min-width: 140px } nav.links { flex-wrap: nowrap } nav.links button { padding: 8px 8px; white-space: nowrap } }
.mc { display: inline-flex; gap: 8px; justify-content: flex-end; font-variant-numeric: tabular-nums; font-weight: 600 }
.mc span { display: inline-flex; align-items: center; gap: 3px }
.mc i { width: 10px; height: 10px; border-radius: 50% }
.mc .m1 { background: var(--gold) } .mc .m2 { background: var(--silver) } .mc .m3 { background: var(--bronze) }
tr.me td { background: color-mix(in srgb, var(--buoy) 14%, transparent) }
.stat.link { cursor: pointer } .stat.link:hover { background: var(--sel) }
select { font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; min-height: 38px }
.hint { color: var(--ink-2); font-size: 14px; margin: 0 0 12px }
.hint b { color: var(--ink) }

/* panels and tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.panel + .panel { margin-top: 16px }
.phead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding: 14px 16px 8px }
.phead h2, .phead h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .01em }
.phead h3 { font-size: 19px }
.sub { color: var(--ink-3); font-size: 13px }
.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700;
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface) }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.mono { font-family: var(--mono); font-size: 13px }
tbody tr.go { cursor: pointer }
tbody tr.go:hover { background: var(--sel) }
tr.out td { color: var(--ink-3) }
.who { font-weight: 600 }
.clubs { color: var(--ink-2); font-size: 13px }
.pct { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end }
.meter { width: 64px; height: 6px; background: var(--grid); border-radius: 3px; position: relative; overflow: hidden }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sea); border-radius: 3px }
.empty { padding: 28px 16px; color: var(--ink-2) }
.more { display: block; margin: 0 auto 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
  padding: 8px 14px; cursor: pointer; font-weight: 600 }
.back { border: 0; background: none; color: var(--sea); font-weight: 600; cursor: pointer; padding: 6px 0; display: inline-flex; gap: 6px; align-items: center }

/* swimmer */
.prof { padding: 16px }
.ptop { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-start; justify-content: space-between }
.pname { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance }
.meta { color: var(--ink-2); margin-top: 4px; font-size: 14px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 12px; cursor: pointer; font-weight: 600;
  display: inline-flex; gap: 6px; align-items: center; min-height: 40px }
.btn.primary { background: var(--sea); border-color: var(--sea); color: var(--sea-ink) }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; border-top: 4px solid var(--c, var(--line)) }
.stat .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2) }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums }
.stat .s { font-size: 12.5px; color: var(--ink-3) }
.chartbox { position: relative; padding: 4px 8px 8px }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart .ax { font: 12px var(--body); fill: var(--ink-3) }
.chart .gl { stroke: var(--grid) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 6px; font-size: 13px; color: var(--ink-2) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--c) }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 18px rgb(0 0 0 / .16); padding: 8px 10px; font-size: 13px; max-width: 280px; z-index: 10; display: none }
.tip b { display: block; margin-bottom: 2px }
.medal { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700;
  color: #fff; vertical-align: -3px; margin-left: 4px }
.m1 { background: var(--gold) } .m2 { background: var(--silver) } .m3 { background: var(--bronze) }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px }

/* compare */
.cmpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 12px; border-top: 4px solid var(--c) }
.slot .search { flex: none; min-width: 0 }
.slot h3 { margin: 10px 0 2px; font-family: var(--display); font-size: 24px; line-height: 1.1 }
.rivals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer }
.radarwrap { display: grid; grid-template-columns: minmax(280px, 460px) 1fr; gap: 12px 24px; padding: 0 16px 16px; align-items: start }
.radar svg { width: 100%; height: auto; display: block; overflow: visible }
.radar .ax { font: 600 12.5px var(--body); fill: var(--ink-2) }
.radar .rl { font: 11px var(--body); fill: var(--ink-3) }
.win { font-weight: 700 }

/* races picker */
.picker { display: grid; grid-template-columns: 170px 240px 1fr; gap: 16px; align-items: start }
.picker > * { min-width: 0 } .picker > .panel, .picker .panel:first-child { margin-top: 0 }
.plist { display: flex; flex-direction: column; gap: 2px; padding: 6px }
.plist button { display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 9px 10px; border-radius: 7px;
  cursor: pointer; text-align: left; font-weight: 600; color: var(--ink-2); min-height: 40px; align-items: center }
.plist button:hover { background: var(--sel); color: var(--ink) }
.plist button[aria-current=true] { background: var(--sea); color: var(--sea-ink) }
.plist button small { font-weight: 400; opacity: .8; white-space: nowrap }
.plabel { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 10px 12px 2px }
.ctrls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; padding: 0 16px 12px }
.agh { margin: 0; padding: 12px 16px 4px; font-family: var(--display); font-size: 18px; border-top: 1px solid var(--line) }
.matrix td.num, .matrix th.num { min-width: 52px }
.matrix td.h { background: color-mix(in srgb, var(--gold) var(--a), transparent) }
.matrix td b { font-size: 15px } .matrix td .sub { margin-left: 4px }
.matrix tr.tot td { border-top: 2px solid var(--line); font-weight: 700 }

/* clubs */
.mh { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end }
.mh .medal { margin: 0 }
td.cnt { font-weight: 700 }
td.zero { color: var(--ink-3); font-weight: 400 }
.heat td.num { min-width: 46px }
.heat td.h { background: color-mix(in srgb, var(--sea) var(--a), transparent) }
.heat th.num { text-align: right }
.clubf { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; margin: 0 0 14px }
a.clink { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start }
.two .panel { margin: 0 }
a.clink:hover { text-decoration-color: currentColor }

footer { margin-top: 24px; color: var(--ink-2); font-size: 13px; max-width: 86ch; display: grid; gap: 6px }

@media (max-width: 760px) {
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) }
  .bar { gap: 8px 10px; padding: 8px 0 }
  .brand { order: 1 } .bar .mode { order: 2 } .search { flex: 1 1 220px; order: 3; max-width: none; min-width: 0 } .lang { order: 4 }
  .brand svg { width: 28px; height: 28px }
  .brand .tl { display: none } .brand .ts { display: block; font-size: 17px; max-width: 120px }
  .mh .lbl { display: none }
  /* rankings as cards: rank | name + club | percentile + medals */
  .rank thead { display: none }
  .rank tbody tr { display: grid; grid-template-columns: 34px 1fr auto; grid-template-areas: "n w p" "n c m"; gap: 2px 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--grid); align-items: center }
  .rank tbody tr:last-child { border-bottom: 0 }
  .rank td { display: none; padding: 0; border: 0 }
  .rank td.c-n { display: block; grid-area: n; font-family: var(--display); font-size: 20px; font-weight: 600; text-align: center; color: var(--ink-2) }
  .rank td.c-w { display: block; grid-area: w; min-width: 0 }
  .rank td.c-c { display: block !important; grid-area: c; font-size: 12.5px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .rank .cr { display: inline }
  .rank td.c-p { display: block; grid-area: p; font-weight: 700 }
  .rank td.c-m { display: block; grid-area: m; font-size: 13px }
  td .sm { display: block; font-size: 12.5px; color: var(--ink-3) }
  .ctrls .seg button { padding: 6px 9px }
  .ctrls { padding: 0 12px 10px; gap: 10px 12px }
  .bar .mode button { padding: 5px 8px; font-size: 13px; min-height: 34px }
  /* bottom tab bar */
  nav.links { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) }
  nav.links button { flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 2px; min-height: 52px; justify-content: center }
  nav.links button svg { width: 20px; height: 20px }
  nav.links button[aria-current=page] { background: none; color: var(--sea) }
  /* filter summary + bottom sheet */
  .fsum { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 8px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; text-align: left; cursor: pointer; min-height: 46px }
  .fsum small { color: var(--sea); font-weight: 700; white-space: nowrap }
  .fsheet { display: none !important }
  .sheetwrap.open .fsheet { display: flex !important; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface);
    border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .25); padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh; overflow: auto; flex-direction: column; align-items: stretch; gap: 14px }
  .sheetwrap.open .sheetbg { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 45 }
  .sheetwrap.open .sheethead { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 20px }
  .fsheet .seg { display: flex } .fsheet .seg button { flex: 1 } .fsheet select { width: 100% }
  .two { grid-template-columns: 1fr }
  .picker { grid-template-columns: 1fr; gap: 10px }
  .plist { flex-direction: row; overflow-x: auto; gap: 6px; padding: 8px }
  .plist button { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; min-height: 38px }
  .plabel { display: none }
  .pname { font-size: 28px }
  .hide-sm { display: none }
  .meter { display: none }
  td, th { padding: 7px 6px }
  th { white-space: normal }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <button class="brand" id="home" type="button" aria-label="Home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--sea)"/>
        <path d="M5 19c3 0 3-2.5 6-2.5s3 2.5 6 2.5 3-2.5 6-2.5 3 2.5 6 2.5M5 24c3 0 3-2.5 6-2.5s3 2.5 6 2.5 3-2.5 6-2.5 3 2.5 6 2.5" stroke="var(--surface)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="17" cy="10.5" r="3.2" fill="var(--buoy)"/></svg>

// unnamed = 1: the result file had a club or heading where the name should be; the swim still counts for places
// "AHMET YILMAZ" / "ahmet yılmaz" -> "Ahmet Yılmaz"; words already in mixed case ("McDonald") are kept
const tc = n => String(n).split(/(\s+)/).map(w => w === w.toLocaleUpperCase("tr") || w === w.toLocaleLowerCase("tr")
  ? w.toLocaleLowerCase("tr").replace(/(^|[.\-'’(])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase("tr")) : w).join("");
const SW = D.swimmers.map(([name, sex, clubs, variants, unnamed = 0], i) => ({ i, name: unnamed ? t("unreadable") : tc(name), sex, clubs, variants: variants.map(tc), unnamed, res: [] }));
const CLUBS = (D.clubs || []).map((name, i) => ({ i, name }));
const ALL = D.results.map(([s, r, ag, time, st, ps, ns, pa, na, c = -1]) => {
  const x = { s, r: RACES[r], ag, time, st, ps, ns, pa, na, c,
    pctS: ps ? (ps - .5) / ns * 100 : null, pctA: pa ? (pa - .5) / na * 100 : null };
  SW[s].res.push(x);
  return x;
});
SW.forEach(s => s.res.sort((a, b) => (b.r.date || "").localeCompare(a.r.date || "") || b.r.year - a.r.year));
const MAXY = Math.max(...RACES.map(r => r.year));
const DISTS = { open: [1000, 2000, 3000, 5000, 6000, 10000], canal: [6500, 4500] };
const dcol = d => `var(--d${d})`;
const fold = s => String(s).toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i");
SW.forEach(s => { s.key = [s.name, ...s.variants].map(fold).join(" | "); s.n = s.res.length; });
const raceName = r => `${r.brand}${r.stage ? " " + r.stage : ""} ${r.year}`;
const fmtT = s => { if (s == null) return "–"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const paceOf = x => x.time ? x.time / x.r.dist * 100 : null;
const fmtP = p => { if (p == null) return "–"; const m = Math.floor(p / 60), s = Math.round(p % 60); return m + ":" + String(s === 60 ? 59 : s).padStart(2, "0"); };
const pctTxt = p => p == null ? "–" : (p < 1 ? "<1" : Math.round(p));
const dateTxt = r => r.date ? new Date(r.date + "T12:00").toLocaleDateString({ tr: "tr-TR", en: "en-GB", ru: "ru-RU" }[lang], { day: "numeric", month: "short", year: "numeric" }) : String(r.year);

/* Rating = field-weighted, shrunk average. Each result weighs √(finishers in its age group), so a
   2-person group counts far less than a 40-person one; then one imaginary mid-field result (top 50% in
   a field of 4) is mixed in, so a single lucky swim can't outrank a long consistent record. */
const PRIOR_W = Math.sqrt(4), PRIOR = 50;
function score(list, key = "pctA", nkey = "na") {
  let w = 0, s = 0, best = null, n = 0;
  for (const x of list) {
    // races with no published age groups (Çanakkale 2023–2025) fall back to the overall Kadın/Erkek percentile
    const v = x[key] ?? (key === "pctA" ? x.pctS : null), f = x[nkey] ?? x.ns;
    if (v == null) continue;
    const k = Math.sqrt(f); w += k; s += k * v; n++; best = best == null ? v : Math.min(best, v);
  }
  return w ? { avg: (s + PRIOR_W * PRIOR) / (w + PRIOR_W), raw: s / w, best, n } : null;
}
const distKey = r => r.dist; // canal distances are unique (6500 Boğaziçi, 4500 Çanakkale)

/* ---------- state ---------- */
const F = Object.assign({ mode: "open", sex: "M", ag: "35-39", dist: 5000, wet: 0, years: "all", cut: 15 }, store.get("filters", {}));
let view = { name: "rank" }, limit = 100, metric = store.get("metric", "pct"), cmpB = null;

/* ---------- search (top bar and compare slots) ---------- */
function searchBox(host, onPick, placeholderKey = "searchPh") {
  host.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <input type="search" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="${esc(t(placeholderKey))}" aria-label="${esc(t("searchPh"))}">
    <ul class="sugg" role="listbox" hidden></ul>`;
  const inp = host.querySelector("input"), ul = host.querySelector("ul");
  let items = [], act = 0;
  const close = () => { ul.hidden = true; inp.setAttribute("aria-expanded", "false"); };
  const draw = () => {
    ul.innerHTML = items.map((s, k) => `<li role="option" id="${host.id || "s"}-o${k}" aria-selected="${k === act}" data-k="${k}">
      <span>${esc(s.name)}</span><small>${t(s.sex) || ""} · ${s.n} ${t("races")}</small></li>`).join("");
    ul.hidden = !items.length; inp.setAttribute("aria-expanded", String(!!items.length));
  };
  inp.addEventListener("input", () => {
    const q = fold(inp.value.trim());
    if (q.length < 2) { items = []; close(); return; }
    const parts = q.split(/\s+/);
    items = SW.filter(s => !s.unnamed && parts.every(p => s.key.includes(p))).sort((a, b) => b.n - a.n).slice(0, 10);
    act = 0; draw();
  });
  inp.addEventListener("keydown", e => {
    if (ul.hidden) return;
    if (e.key === "ArrowDown") { act = Math.min(items.length - 1, act + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && items[act]) { pick(items[act]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  const pick = s => { inp.value = ""; close(); onPick(s); };
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); pick(items[+li.dataset.k]); } });
  inp.addEventListener("blur", () => setTimeout(close, 120));
  return inp;
}

/* ---------- filters ---------- */
function segment(el, opts, cur, onSet) {
  el.innerHTML = opts.map(([v, label, dis]) => `<button type="button" aria-pressed="${String(v) === String(cur)}" data-v="${v}" ${dis ? "disabled" : ""}>${label}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (b && !b.disabled) onSet(b.dataset.v); };
}
function poolFor(opts = {}) {
  const yMin = F.years === "all" ? 0 : MAXY - +F.years + 1;
  return ALL.filter(x => x.r.canal === (F.mode === "canal" ? 1 : 0) && SW[x.s].sex === F.sex && x.r.year >= yMin
    && (opts.anyDist || x.r.dist === +F.dist) && (F.mode === "canal" || opts.anyWet || x.r.wet === +F.wet));
}
const agStart = a => { const m = /(\d+)/.exec(a); return m ? +m[1] : 999; };
let AGS = [];
function drawFilters() {
  segment($("#fMode"), [["open", t("open")], ["canal", t("canal")]], F.mode, v => { F.mode = v; if (!DISTS[v].includes(+F.dist)) F.dist = DISTS[v][v === "open" ? 3 : 0];
    if (KF.dist !== "all" && !DISTS[v].includes(+KF.dist)) KF.dist = "all"; if (KF.brand !== "all" && !brandsFor().includes(KF.brand)) KF.brand = "all"; store.set("clubF", KF);
    if (view.name === "race") { store.set("filters", F); go("#/races"); } else changed(); });
  segment($("#fSex"), [["F", t("F")], ["M", t("M")]], F.sex, v => { F.sex = v; changed(); });
  const hasDist = new Set(poolFor({ anyDist: true, anyWet: true }).map(x => x.r.dist));
  segment($("#fDist"), DISTS[F.mode].map(d => [d, t("km", d), !hasDist.has(d)]), F.dist, v => { F.dist = +v; changed(); });
  $("#suitFld").hidden = F.mode === "canal";
  segment($("#fWet"), [[0, t("skin")], [1, t("wet")]], F.wet, v => { F.wet = +v; changed(); });
  segment($("#fYears"), [["all", t("allYears")], ["1", t("lastN", 1)], ["2", t("lastN", 2)], ["3", t("lastN", 3)]], F.years, v => { F.years = v; changed(); });
  const counts = {};
  for (const x of poolFor()) if (x.ag && x.pa) counts[x.ag] = (counts[x.ag] || 0) + 1;
  const ags = Object.keys(counts).sort((a, b) => agStart(a) - agStart(b) || a.localeCompare(b));
  if (ags.length && !ags.includes(F.ag)) F.ag = ags.reduce((a, b) => counts[b] > counts[a] ? b : a);
  AGS = ags;
  // age groups as buttons (g): a wrapping row in the filter bar / phone sheet, a vertical column beside the ranking on desktop
  segment($("#fAg"), ags.length ? ags.map(a => [a, esc(a)]) : [["", "–", true]], F.ag, v => { F.ag = v; changed(); });
  document.body.classList.toggle("v-rank", view.name === "rank");
  // a swimmer page shows filters for context only (g): nothing in the bar responds there
  const lock = view.name === "swimmer";
  $("#filterBar").classList.toggle("locked", lock); $("#fMode").classList.toggle("locked", lock);
  $("#fSum").disabled = lock;
  if (lock) document.querySelectorAll("#fSheet .seg button, #fMode button").forEach(b => { b.disabled = true; b.tabIndex = -1; });
  $("#fSum").innerHTML = `<span>${[t(F.sex), F.ag, t("km", F.dist), F.mode === "canal" ? "" : (+F.wet ? t("wet") : t("skin")), F.years === "all" ? "" : t("lastN", +F.years)].filter(Boolean).map(esc).join(" · ")}</span><small>${t("change")}</small>`;
}
function changed() { store.set("filters", F); limit = 100; render(); }
const sheet = open => { $("#filterBar").classList.toggle("open", open); $("#fSum").setAttribute("aria-expanded", String(open)); };
$("#fSum").onclick = () => sheet(true); $("#fDone").onclick = $("#sheetBg").onclick = () => sheet(false);

/* ---------- rankings ---------- */
let hl = null; // swimmer to highlight when coming back from a swimmer page
function rankRows() {
  const pool = poolFor().filter(x => x.ag === F.ag);
  const by = new Map();
  for (const x of pool) { if (!by.has(x.s)) by.set(x.s, []); by.get(x.s).push(x); }
  const raceCount = new Set(pool.map(x => x.r.i)).size;
  let rows = [...by].map(([s, list]) => ({ s: SW[s], list, sc: score(list), last: list.reduce((a, b) => (b.r.date || "") > (a.r.date || "") ? b : a) }))
    .filter(r => r.sc && !r.s.unnamed);
  const total = rows.length;
  rows.sort((a, b) => a.sc.avg - b.sc.avg || b.sc.n - a.sc.n);
  // shown percentile = position in this filtered list: first is 1/total, last is exactly 100%
  rows.forEach((r, k) => r.rp = (k + 1) / total * 100);
  rows.forEach(r => { r.med = [0, 0, 0]; for (const x of r.list) if (x.pa && x.pa <= 3) r.med[x.pa - 1]++; });
  return { rows, total, raceCount };
}
const medTxt = m => `<span class="mc">${m.map((v, k) => v ? `<span title="${t(["gold", "silver", "bronze"][k])}"><i class="m${k + 1}"></i>${v}</span>` : "").join("")}</span>`;
function renderRank() {
  const { rows, total, raceCount } = rankRows();
  const at = hl == null ? -1 : rows.findIndex(r => r.s.i === hl);
  if (at >= limit) limit = Math.ceil((at + 1) / 100) * 100;
  const shown = rows.slice(0, limit);
  $("#main").innerHTML = `<div class="rankgrid"><aside class="agside" aria-label="${esc(t("ageGroup"))}"><div class="aglab">${t("ageGroup")}</div><div class="seg vert" id="agSide" role="group"></div></aside><div class="rankmain">
  <p class="hint">${t("rankHint", total, raceCount)}</p>
  <div class="panel"><div class="tablewrap">${rows.length ? `<table class="rank">
    <thead><tr><th class="num">${t("colRank")}</th><th>${t("colName")}</th><th class="hide-sm">${t("colClub")}</th>
      <th class="num hide-sm">${t("colRaces")}</th><th class="num">${t("colAvg")}</th><th class="num">${t("colMedals")}</th><th class="num hide-sm">${t("colBest")}</th><th class="hide-sm">${t("colLast")}</th></tr></thead>
    <tbody>${shown.map((r, k) => `<tr class="go${r.s.i === hl ? " me" : ""}" tabindex="0" data-s="${r.s.i}">
      <td class="num c-n">${k + 1}</td><td class="c-w"><div class="who">${esc(r.s.name)}</div></td>
      <td class="clubs hide-sm c-c">${esc(r.s.clubs[0] || "")}<span class="cr"> · ${r.sc.n} ${r.sc.n === 1 ? t("race") : t("races")}</span></td>
      <td class="num hide-sm">${r.sc.n}</td>
      <td class="num c-p"><span class="pct"><span class="meter" aria-hidden="true"><i style="width:${Math.max(2, 100 - r.rp)}%"></i></span>${t("top", Math.round(r.rp) || 1)}</span></td>
      <td class="num c-m">${medTxt(r.med)}</td>
      <td class="num hide-sm">${t("top", pctTxt(r.sc.best))}</td>
      <td class="sub hide-sm">${esc(raceName(r.last.r))}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${t("noRows")}</div>`}</div>
    ${rows.length > limit ? `<button class="more" type="button" id="more">${t("moreRows", Math.min(100, rows.length - limit))}</button>` : ""}</div></div></div>`;
  segment($("#agSide"), AGS.map(a => [a, esc(a)]), F.ag, v => { F.ag = v; changed(); });
  const more = $("#more"); if (more) more.onclick = () => { limit += 100; renderRank(); };
  bindRows();
  const me = document.querySelector("tr.me"); if (me) me.scrollIntoView({ block: "center" });
  hl = null;
}
function bindRows() {
  document.querySelectorAll("tr.go[data-s]").forEach(tr => {
    const open = () => go(`#/s/${tr.dataset.s}`);
    tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); };
  });
}

/* ---------- swimmer ---------- */
function groupByDist(res) {
  const m = new Map();
  for (const x of res) { const k = distKey(x.r); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return [...m].sort((a, b) => (a[1][0].r.canal - b[1][0].r.canal) || a[0] - b[0]);
}
const medal = p => p && p <= 3 ? `<span class="medal m${p}" aria-label="${p}">${p}</span>` : "";
function renderSwimmer(s) {
  const groups = groupByDist(s.res);
  const ags = [...new Set(s.res.map(x => x.ag).filter(Boolean))].reverse();
  $("#main").innerHTML = `<button class="back" type="button" id="back">← ${t("backRank")}</button>
  <div class="panel"><div class="prof">
    <div class="ptop"><div><h1 class="pname">${esc(s.name)}</h1>
      <div class="meta">${t(s.sex) || ""}${ags.length ? ` · ${t("ageGroups")}: ${ags.map(esc).join(", ")}` : ""}</div>
      ${(() => { const cs = [...new Set(s.res.map(x => x.c).filter(c => c >= 0))];
        return cs.length ? `<div class="meta">${t("clubs")}: ${cs.map(c => `<a class="clink" href="#/k/${c}">${esc(CLUBS[c].name)}</a>`).join(" · ")}</div>` : ""; })()}</div>
</div>
    <div class="strip">
      ${(() => { const { rows, total } = rankRows(), k = rows.findIndex(r => r.s.i === s.i), lab = [F.ag, t("km", F.dist), F.mode === "canal" ? "" : (+F.wet ? t("wet") : t("skin"))].filter(Boolean).join(" · ");
        return k < 0 ? `<div class="stat" style="--c:var(--buoy)"><div class="k">${esc(lab)}</div><div class="v">–</div><div class="s">${t("notInCat")}</div></div>`
          : `<div class="stat link" id="catCard" role="link" tabindex="0" style="--c:var(--buoy)"><div class="k">${esc(lab)}</div><div class="v">${t("top", Math.round(rows[k].rp) || 1)}</div>
            <div class="s">${k + 1} / ${total} · <a href="#/" onclick="return false">${t("showInRank")}</a></div></div>`; })()}
      <div class="stat"><div class="k">${t("totalRaces")}</div><div class="v">${s.res.length}</div><div class="s">${new Set(s.res.map(x => x.r.year)).size} ${t("yearsWord")}</div></div>
      ${groups.map(([d, list]) => { const sc = score(list); return `<div class="stat" style="--c:${dcol(d)}"><div class="k">${t("km", d)}</div>
        <div class="v">${sc ? t("top", pctTxt(sc.raw)) : "–"}</div><div class="s">${list.length} ${list.length === 1 ? t("race") : t("races")}${sc ? ` · ${t("best")} ${t("top", pctTxt(sc.best))}` : ""}</div></div>`; }).join("")}
    </div></div></div>
  <div class="panel"><div class="phead"><h3>${t("historyH")}</h3>
    <div class="seg" id="metric" role="group"></div></div>
    <div class="legend" id="legend"></div><div class="chartbox chart" id="chart"></div></div>
  <div class="panel"><div class="phead"><h3>${t("raceListH")}</h3><span class="sub">${s.res.length} ${t("races")}</span></div>
    <div class="tablewrap"><table><thead><tr><th class="hide-sm">${t("colDate")}</th><th>${t("colRace")}</th><th>${t("colDist")}</th>
      <th class="num">${t("colTime")}</th><th class="num hide-sm">${t("colPace")}</th><th class="num">${t("colAgPct")}</th><th class="num hide-sm">${t("colAllPct")}</th></tr></thead>
    <tbody>${s.res.map(x => { const out = x.time == null; return `<tr class="go${out ? " out" : ""}" tabindex="0" data-r="${x.r.i}">
      <td class="num hide-sm" style="text-align:left">${dateTxt(x.r)}</td><td>${esc(x.r.brand)}${x.r.stage ? ` <span class="sub">${esc(x.r.stage)}</span>` : ""}<span class="sm">${dateTxt(x.r)}</span></td>
      <td><span class="dot" style="--c:${dcol(x.r.dist)}"></span>${t("km", x.r.dist)}${x.r.canal ? "" : ` <span class="sub">${x.r.wet ? t("wet") : t("skin")}</span>`}</td>
      <td class="num mono">${out ? (x.st || t("dnf")) : fmtT(x.time)}<span class="sm">${fmtP(paceOf(x))}/100m</span></td><td class="num mono hide-sm">${fmtP(paceOf(x))}</td>
      <td class="num">${x.pa ? `${t("top", pctTxt(x.pctA))} <span class="sub">${x.pa}/${x.na}</span>${medal(x.pa)}` : "–"}</td>
      <td class="num hide-sm">${x.ps ? `${t("top", pctTxt(x.pctS))} <span class="sub">${x.ps}/${x.ns}</span>${medal(x.ps)}` : "–"}</td></tr>`; }).join("")}</tbody></table></div></div>`;
  $("#back").onclick = () => { hl = s.i; go("#/"); };
  const cat = $("#catCard"); if (cat) cat.onclick = () => { hl = s.i; go("#/"); };
  document.querySelectorAll("tr.go[data-r]").forEach(tr => { const o = () => go(`#/r/${tr.dataset.r}`); tr.onclick = o; tr.onkeydown = e => { if (e.key === "Enter") o(); }; });
  const drawM = () => { segment($("#metric"), [["pct", t("percentile")], ["pace", t("pace")]], metric, v => { metric = v; store.set("metric", v); drawM(); }); drawChart(s, groups); };
  drawM();
}

/* Year on x, one line per distance; each point is that year's field-weighted percentile (or mean pace). */
function drawChart(s, groups) {
  const W = Math.max(320, $("#chart").clientWidth - 16), H = W < 640 ? 240 : 300, m = { l: 52, r: 18, t: 18, b: 30 };
  const series = groups.map(([d, list]) => {
    const yrs = new Map();
    for (const x of list) { if (x.time == null) continue; if (!yrs.has(x.r.year)) yrs.set(x.r.year, []); yrs.get(x.r.year).push(x); }
    const pts = [...yrs].map(([y, l]) => {
      const v = metric === "pct" ? score(l)?.raw : l.reduce((a, x) => a + paceOf(x), 0) / l.length;
      return { y, v, l };
    }).filter(p => p.v != null).sort((a, b) => a.y - b.y);
    return { d, pts };
  }).filter(se => se.pts.length);
  $("#legend").innerHTML = series.map(se => `<span><i style="--c:${dcol(se.d)}"></i>${t("km", se.d)}</span>`).join("");
  const box = $("#chart");
  if (!series.length) { box.innerHTML = `<div class="empty">–</div>`; return; }
  const ys = series.flatMap(se => se.pts.map(p => p.y)), vs = series.flatMap(se => se.pts.map(p => p.v));
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  let v0, v1;
  if (metric === "pct") { v0 = 0; v1 = Math.min(100, Math.ceil(Math.max(...vs) / 10) * 10 || 10); }
  else { v0 = Math.floor(Math.min(...vs) / 10) * 10; v1 = Math.ceil(Math.max(...vs) / 10) * 10; if (v1 - v0 < 20) v1 = v0 + 20; }
  const X = y => m.l + (y - y0) / (y1 - y0) * (W - m.l - m.r);
  const Y = v => m.t + (v - v0) / (v1 - v0) * (H - m.t - m.b); // smaller (better) on top for both metrics
  const tick = metric === "pct" ? 10 * Math.max(1, Math.round((v1 - v0) / 50)) : (v1 - v0 > 80 ? 20 : 10);
  let g = "";
  for (let v = v0; v <= v1 + .01; v += tick) g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${metric === "pct" ? (lang === "tr" ? "%" + v : v + "%") : fmtP(v)}</text>`;
  const step = Math.max(1, Math.ceil((y1 - y0) / 10));
  for (let y = Math.ceil(y0); y <= y1; y += step) g += `<text class="ax" x="${X(y)}" y="${H - 8}" text-anchor="middle">${y}</text>`;
  g += `<text class="ax" x="${m.l}" y="${m.t - 2}" style="font-size:11px">${metric === "pct" ? t("pctAxis") : t("paceAxis")}</text>`;
  const lines = series.map(se => `<path d="${se.pts.map((p, k) => (k ? "L" : "M") + X(p.y) + " " + Y(p.v)).join("")}" fill="none" stroke="${dcol(se.d)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    + se.pts.map(p => `<circle cx="${X(p.y)}" cy="${Y(p.v)}" r="4.5" fill="${dcol(se.d)}" stroke="var(--surface)" stroke-width="2"/>`).join("")).join("");

/* ---------- clubs: Olympic-style medal table ---------- */

const BRANDS = [...new Set(RACES.map(r => r.brand))].sort((a, b) => RACES.filter(r => r.brand === b).length - RACES.filter(r => r.brand === a).length);

function selectHTML(id, opts, cur) { return `<select id="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`; }

    <thead><tr><th>${t("series")}</th>${yrs.map(y => `<th class="num">${y}</th>`).join("")}<th class="num">${t("total")}</th></tr></thead>
    <tbody>${evs.map(b => `<tr><td class="who">${esc(b)}</td>${yrs.map(y => mcell(b, y)).join("")}${mcell(b, "T")}</tr>`).join("")}
      <tr class="tot"><td>${t("total")}</td>${yrs.map(y => mcell("T", y)).join("")}${mcell("T", "T")}</tr></tbody></table></div></div>` : "";
  const small = (head, list, lab) => `<table><thead><tr><th>${head}</th>${medalHead()}</tr></thead><tbody>${list.map(e => `<tr><td>${lab(e)}</td>${medalCells(e)}</tr>`).join("")}</tbody></table>`;
  $("#main").innerHTML = `<button class="back" type="button" id="back">← ${t("backClubs")}</button>
  <div class="panel"><div class="prof">
    <h1 class="pname">${esc(cl.name)}</h1>
    <div class="meta">${t("clubMeta", new Set(mine.map(x => x.s)).size, mine.length)}</div>
    <div style="margin-top:12px">${clubFilters(false)}</div>
    <div class="strip">${[0, 1, 2].map(k => `<div class="stat" style="--c:var(--${["gold", "silver", "bronze"][k]})"><div class="k">${t(["gold", "silver", "bronze"][k])}</div><div class="v">${all.m[k]}</div></div>`).join("")}
      <div class="stat"><div class="k">${t("total")}</div><div class="v">${all.tot}</div><div class="s">${all.sw.size} ${t("medalists").toLocaleLowerCase(lang)}</div></div></div>
  </div></div>
  ${matrix}
  ${ms.length ? `
  <div class="panel"><div class="phead"><h3>${t("medalists")}</h3><span class="sub">${bySw.length}</span></div><div class="tablewrap"><table>
    <thead><tr><th>${t("colSwim")}</th>${medalHead()}</tr></thead>
    <tbody>${bySw.map(e => `<tr class="go" tabindex="0" data-s="${e.k}"><td class="who">${esc(SW[e.k].name)}</td>${medalCells(e)}</tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><div class="phead"><h3>${t("recent")}</h3><span class="sub">${recent.length}</span></div><div class="tablewrap"><table>
    <thead><tr><th class="hide-sm">${t("colDate")}</th><th>${t("colRace")}</th><th>${t("colDist")}</th><th>${t("colSwim")}</th><th class="num">${t("place")}</th></tr></thead>
    <tbody>${recent.slice(0, recentN).map(({ x, p }) => `<tr class="go" tabindex="0" data-r="${x.r.i}"><td class="hide-sm">${dateTxt(x.r)}</td><td>${esc(x.r.brand)}${x.r.stage ? ` <span class="sub">${esc(x.r.stage)}</span>` : ""}<span class="sm">${dateTxt(x.r)}</span></td>
      <td><span class="dot" style="--c:${dcol(x.r.dist)}"></span>${t("km", x.r.dist)}${x.r.canal ? "" : ` <span class="sub">${x.r.wet ? t("wet") : t("skin")}</span>`}</td>
      <td class="who">${esc(SW[x.s].name)}${KF.type === "ag" && x.ag ? ` <span class="sub">${esc(x.ag)}</span>` : ""}</td><td class="num">${medal(p)}</td></tr>`).join("")}</tbody></table></div>
    ${recent.length > recentN ? `<button class="more" type="button" id="moreRec">${t("moreMed", Math.min(50, recent.length - recentN))}</button>` : ""}</div>`
  : `<div class="panel" style="margin-top:16px"><div class="empty">${t("noMedals")}</div></div>`}`;
  $("#back").onclick = () => go("#/clubs");
  const mr = $("#moreRec"); if (mr) mr.onclick = () => { recentN += 50; renderClub(cl); };
  bindClubFilters(() => renderClub(cl));
  bindRows();
  document.querySelectorAll("tr.go[data-r]").forEach(tr => { const o = () => go(`#/r/${tr.dataset.r}`); tr.onclick = o; tr.onkeydown = e => { if (e.key === "Enter") o(); }; });
}

/* ---------- routing ---------- */
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  const p = location.hash.replace(/^#\/?/, "").split("/");
  $("#tip").style.display = "none";
  if (p[0] === "s" && SW[+p[1]]) view = { name: "swimmer", s: SW[+p[1]] };
  else if (p[0] === "races") view = { name: "races" };
  else if (p[0] === "clubs") view = { name: "clubs" };
  else if (p[0] === "k" && CLUBS[+p[1]]) { view = { name: "club", c: CLUBS[+p[1]] }; recentN = 30; }
  else if (p[0] === "r" && RACES[+p[1]]) view = { name: "race", r: RACES[+p[1]] };
  else view = { name: "rank" };
  render(true);
}
function render(scroll) {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const nav = { rank: "rank", swimmer: "rank", races: "races", race: "races", clubs: "clubs", club: "clubs" }[view.name];
  document.querySelectorAll("[data-nav]").forEach(b => b.dataset.nav === nav ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#filterBar").hidden = !(view.name === "rank" || view.name === "swimmer");
  if (scroll) sheet(false);
  drawFilters();
  if (view.name === "rank") renderRank();
  else if (view.name === "swimmer") renderSwimmer(view.s);
  else if (view.name === "races") renderRaces();
  else if (view.name === "clubs") renderClubs();
  else if (view.name === "club") renderClub(view.c);
  else renderRace(view.r);
  $("#coverage").textContent = t("coverage", RACES.length.toLocaleString(), SW.length.toLocaleString());
  if (scroll) window.scrollTo({ top: view.name === "swimmer" ? Math.max(0, $("#main").offsetTop - 70) : 0 });
}
$("#home").onclick = () => go("#/");
document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => go({ rank: "#/", races: "#/races", clubs: "#/clubs" }[b.dataset.nav]));
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("lang", lang); mountSearch(); render(); });
function mountSearch() { searchBox($("#topSearch"), s => go(`#/s/${s.i}`)); }
mountSearch();
window.addEventListener("hashchange", route);
route();
})();
</script>

</body>
</html>
